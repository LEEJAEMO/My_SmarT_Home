# Home Assistant deployment configuration
# Managed from the ha-deploy branch. Keep real secrets only in /config/secrets.yaml.

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  packages: !include_dir_named packages

conversation:

lovelace:
  dashboards:
    smart-home:
      mode: yaml
      title: 스마트홈
      icon: mdi:home-assistant
      show_in_sidebar: true
      filename: dashboards/smart_home.yaml

switchbot_ir_allowlist:
  token: !secret switchbot_api_token
  secret: !secret switchbot_api_secret
  min_gap_seconds: 2
  commands:
    daikin_cool_26:
      device_id: !secret switchbot_daikin_cool_device_id
      command: turnOn
      command_type: command
    daikin_heat_20:
      device_id: !secret switchbot_daikin_heat_device_id
      command: turnOn
      command_type: command
    daikin_dry:
      device_id: !secret switchbot_daikin_dry_device_id
      command: turnOn
      command_type: command
    daikin_off:
      device_id: !secret switchbot_daikin_off_device_id
      command: turnOff
      command_type: command
    fan_power:
      device_id: !secret switchbot_fan_device_id
      command: POWER
      command_type: customize
    fan_speed_cycle:
      device_id: !secret switchbot_fan_device_id
      command: Fan Speed 3
      command_type: customize
    fan_timer_cycle:
      device_id: !secret switchbot_fan_device_id
      command: Timer
      command_type: customize
    fan_mute_toggle:
      device_id: !secret switchbot_fan_device_id
      command: Mute
      command_type: customize
    light_on:
      device_id: !secret switchbot_light_device_id
      command: ON
      command_type: customize
    light_off:
      device_id: !secret switchbot_light_device_id
      command: OFF
      command_type: customize
    light_brighter:
      device_id: !secret switchbot_light_device_id
      command: 밝기증가
      command_type: customize
    light_dimmer:
      device_id: !secret switchbot_light_device_id
      command: 밝기감소
      command_type: customize
    projector_on:
      device_id: !secret switchbot_projector_device_id
      command: ON
      command_type: customize
    projector_off:
      device_id: !secret switchbot_projector_device_id
      command: OFF
      command_type: customize
    projector_power:
      device_id: !secret switchbot_projector_device_id
      command: 전원
      command_type: customize
