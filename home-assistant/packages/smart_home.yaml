input_text:
  smarthome_resident_person:
    name: "스마트홈 재실 사용자 엔티티"
    max: 100
  smarthome_curtain_entity:
    name: "SwitchBot 커튼 엔티티"
    max: 100
  smarthome_co2_entity:
    name: "SwitchBot CO2 엔티티"
    max: 100
  smarthome_temperature_entity:
    name: "SwitchBot 실내 온도 엔티티"
    max: 100
  smarthome_notify_service:
    name: "S23 알림 서비스"
    max: 100
  smarthome_scene_status:
    name: "장면 마지막 요청 (실제 완료 아님)"
    max: 255
input_boolean:
  aircon_assumed_on:
    name: "에어컨 추정 전원"
    icon: "mdi:air-conditioner"
  projector_assumed_on:
    name: "프로젝터 추정 전원"
    icon: "mdi:projector"
  projector_discrete_power:
    name: "프로젝터 ON/OFF 분리 코드 사용"
    icon: "mdi:power-settings"
  ventilation_active:
    name: "환기 장면 실행 중"
    icon: "mdi:window-open-variant"
    initial: false
  smarthome_curtain_verified:
    name: "관리자: 커튼 연결 검증 완료"
  smarthome_automations_enabled:
    name: "관리자: 재실·기상 자동화 허용"
  smarthome_notifications_enabled:
    name: "관리자: 환경 알림 허용"
  projector_state_known:
    name: "관리자: 프로젝터 실제 상태 확인"
    initial: false
  smarthome_voice_enabled:
    name: "관리자: 검증된 준비 장면 음성 허용"
input_select:
  aircon_assumed_mode:
    name: "에어컨 추정 운전 상태"
    options:
      - "미확인"
      - "꺼짐"
      - "냉방26"
      - "난방20"
      - "제습"
    initial: "미확인"
    icon: "mdi:air-conditioner"
script:
  aircon_cool_26:
    alias: "에어컨 냉방 26도 시작"
    description: "이전 호출 호환성을 위한 차단용 스크립트. 실제 IR을 보내지 않습니다."
    icon: "mdi:snowflake"
    mode: "single"
    sequence:
      -
        stop: "사용 불가: 현재 에어컨은 전원/모드/예약 토글·순환뿐입니다. 확정 프리셋을 먼저 검증하세요."
        error: true
  aircon_heat_20:
    alias: "에어컨 난방 20도 시작"
    description: "이전 호출 호환성을 위한 차단용 스크립트. 실제 IR을 보내지 않습니다."
    icon: "mdi:fire"
    mode: "single"
    sequence:
      -
        stop: "사용 불가: 현재 에어컨은 전원/모드/예약 토글·순환뿐입니다. 확정 프리셋을 먼저 검증하세요."
        error: true
  aircon_dry:
    alias: "에어컨 제습 시작"
    description: "이전 호출 호환성을 위한 차단용 스크립트. 실제 IR을 보내지 않습니다."
    icon: "mdi:water-percent"
    mode: "single"
    sequence:
      -
        stop: "사용 불가: 현재 에어컨은 전원/모드/예약 토글·순환뿐입니다. 확정 프리셋을 먼저 검증하세요."
        error: true
  aircon_off:
    alias: "에어컨 끄기"
    description: "이전 호출 호환성을 위한 차단용 스크립트. 실제 IR을 보내지 않습니다."
    icon: "mdi:air-conditioner"
    mode: "single"
    sequence:
      -
        stop: "사용 불가: 현재 에어컨은 전원/모드/예약 토글·순환뿐입니다. 확정 프리셋을 먼저 검증하세요."
        error: true
  fan_power:
    alias: "선풍기 전원"
    description: "Comfee 선풍기의 POWER 버튼을 1회 전송합니다. 실제 전원 상태는 읽지 못하므로 토글 동작입니다."
    icon: "mdi:power"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "fan_power"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  fan_speed_cycle:
    alias: "선풍기 풍량 변경"
    description: "풍량을 1 → 2 → 3 → 1 순서로 한 단계 변경합니다."
    icon: "mdi:fan"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "fan_speed_cycle"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  fan_timer_cycle:
    alias: "선풍기 타이머 변경"
    description: "타이머를 1시간 → 2시간 → … → 6시간 순서로 한 단계 변경합니다."
    icon: "mdi:timer-outline"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "fan_timer_cycle"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  fan_mute_toggle:
    alias: "선풍기 음소거 전환"
    description: "Comfee 선풍기의 Mute 버튼을 1회 전송합니다."
    icon: "mdi:volume-mute"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "fan_mute_toggle"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  light_on:
    alias: "전등 켜기"
    description: "방 전등에 확정 ON 적외선 신호를 보냅니다."
    icon: "mdi:lightbulb-on"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "light_on"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  light_off:
    alias: "전등 끄기"
    description: "방 전등에 확정 OFF 적외선 신호를 보냅니다."
    icon: "mdi:lightbulb-off"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "light_off"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  light_brighter:
    alias: "전등 밝게"
    description: "방 전등 밝기를 한 단계 올립니다."
    icon: "mdi:brightness-7"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "light_brighter"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  light_dimmer:
    alias: "전등 어둡게"
    description: "방 전등 밝기를 한 단계 낮춥니다."
    icon: "mdi:brightness-5"
    mode: "single"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "light_dimmer"
      -
        delay: "00:00:02"
    max_exceeded: "silent"
  projector_on:
    alias: "프로젝터 켜기"
    description: "프로젝터를 켭니다. 분리 ON 코드 또는 추정 상태가 꺼짐인 전원 토글만 사용합니다."
    icon: "mdi:projector"
    mode: "single"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "template"
                value_template: "{% set v = state_attr('switchbot_ir_allowlist.status', 'verified_actions') or [] %} {{ ('projector_on' in v and 'projector_off' in v) if is_state('input_boolean.projector_discrete_power','on') else 'projector_power' in v }}"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "template"
                value_template: "{{ is_state('input_boolean.projector_discrete_power', 'on') or is_state('input_boolean.projector_state_known', 'on') }}"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        choose:
          -
            conditions:
              -
                condition: "state"
                entity_id: "input_boolean.projector_discrete_power"
                state: "on"
            sequence:
              -
                action: "switchbot_ir_allowlist.send"
                data:
                  action: "projector_on"
          -
            conditions:
              -
                condition: "state"
                entity_id: "input_boolean.projector_assumed_on"
                state: "off"
            sequence:
              -
                action: "switchbot_ir_allowlist.send"
                data:
                  action: "projector_power"
        default:
          -
            stop: "프로젝터가 이미 켜진 것으로 기록되어 있습니다. 물리 상태를 확인하세요."
            error: true
      -
        action: "input_boolean.turn_on"
        target:
          entity_id: "input_boolean.projector_assumed_on"
      -
        action: "input_boolean.turn_off"
        target:
          entity_id: "input_boolean.projector_state_known"
      -
        delay: "00:00:02"
  projector_off:
    alias: "프로젝터 끄기"
    description: "프로젝터를 정상 종료합니다. 전원 토글형이면 Home Assistant가 켰다고 기록한 경우에만 실행합니다."
    icon: "mdi:projector-off"
    mode: "single"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "template"
                value_template: "{% set v = state_attr('switchbot_ir_allowlist.status', 'verified_actions') or [] %} {{ ('projector_on' in v and 'projector_off' in v) if is_state('input_boolean.projector_discrete_power','on') else 'projector_power' in v }}"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "template"
                value_template: "{{ is_state('input_boolean.projector_discrete_power', 'on') or is_state('input_boolean.projector_state_known', 'on') }}"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        choose:
          -
            conditions:
              -
                condition: "state"
                entity_id: "input_boolean.projector_discrete_power"
                state: "on"
            sequence:
              -
                action: "switchbot_ir_allowlist.send"
                data:
                  action: "projector_off"
          -
            conditions:
              -
                condition: "state"
                entity_id: "input_boolean.projector_assumed_on"
                state: "on"
            sequence:
              -
                action: "switchbot_ir_allowlist.send"
                data:
                  action: "projector_power"
        default:
          -
            stop: "프로젝터가 이미 꺼진 것으로 기록되어 있습니다. 물리 상태를 확인하세요."
            error: true
      -
        action: "input_boolean.turn_off"
        target:
          entity_id: "input_boolean.projector_assumed_on"
      -
        action: "input_boolean.turn_off"
        target:
          entity_id: "input_boolean.projector_state_known"
      -
        delay: "00:00:02"
  scene_wake:
    alias: "기상 준비"
    description: "검증된 커튼만 제어. 에어컨·선풍기·조명·프로젝터 자동 조작 없음."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "binary_sensor.smarthome_curtain_ready"
                state: "on"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "기상 준비 요청 진행 · 오류 시 Trace 확인"
      -
        action: "cover.open_cover"
        target:
          entity_id: "{{ states('input_text.smarthome_curtain_entity') }}"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "기상 준비: 커튼 요청 전달 · 다른 가전 제외"
      -
        delay: "00:00:02"
  scene_away:
    alias: "외출 준비"
    description: "검증된 커튼만 제어. 에어컨·선풍기·조명·프로젝터 자동 조작 없음."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "binary_sensor.smarthome_curtain_ready"
                state: "on"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "외출 준비 요청 진행 · 오류 시 Trace 확인"
      -
        action: "cover.close_cover"
        target:
          entity_id: "{{ states('input_text.smarthome_curtain_entity') }}"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "외출 준비: 커튼 요청 전달 · 다른 가전 제외"
      -
        delay: "00:00:02"
  scene_arrival:
    alias: "귀가 준비"
    description: "낮에만 검증된 커튼 열기. 야간 조명 및 냉난방은 미검증으로 제외."
    mode: "single"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "binary_sensor.smarthome_curtain_ready"
                state: "on"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        choose:
          -
            conditions:
              -
                condition: "state"
                entity_id: "sun.sun"
                state: "above_horizon"
            sequence:
              -
                action: "cover.open_cover"
                target:
                  entity_id: "{{ states('input_text.smarthome_curtain_entity') }}"
              -
                action: "input_text.set_value"
                target:
                  entity_id: "input_text.smarthome_scene_status"
                data:
                  value: "귀가: 커튼 열기 요청 전달"
        default:
          -
            action: "input_text.set_value"
            target:
              entity_id: "input_text.smarthome_scene_status"
            data:
              value: "귀가: 야간 자동 조명·에어컨 제외, 실행된 가전 없음"
      -
        delay: "00:00:02"
  scene_movie:
    alias: "영화 준비"
    description: "검증된 커튼만 제어. 에어컨·선풍기·조명·프로젝터 자동 조작 없음."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "binary_sensor.smarthome_curtain_ready"
                state: "on"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "영화 준비 요청 진행 · 오류 시 Trace 확인"
      -
        action: "cover.close_cover"
        target:
          entity_id: "{{ states('input_text.smarthome_curtain_entity') }}"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "영화 준비: 커튼 요청 전달 · 다른 가전 제외"
      -
        delay: "00:00:02"
  scene_sleep:
    alias: "수면 준비"
    description: "검증된 커튼만 제어. 에어컨·선풍기·조명·프로젝터 자동 조작 없음."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "binary_sensor.smarthome_curtain_ready"
                state: "on"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "수면 준비 요청 진행 · 오류 시 Trace 확인"
      -
        action: "cover.close_cover"
        target:
          entity_id: "{{ states('input_text.smarthome_curtain_entity') }}"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "수면 준비: 커튼 요청 전달 · 다른 가전 제외"
      -
        delay: "00:00:02"
  scene_ventilation:
    alias: "환기 기록 시작"
    description: "창문을 직접 연 뒤 시작. 가전 자동 제어 없음. 최신 CO₂ 수신이 필요."
    mode: "single"
    sequence:
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "binary_sensor.smarthome_co2_fresh"
                state: "on"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        if:
          -
            condition: "not"
            conditions:
              -
                condition: "state"
                entity_id: "input_boolean.ventilation_active"
                state: "off"
        then:
          -
            stop: "연결·검증·센서 조건 미충족. 실행하지 않았습니다."
            error: true
      -
        action: "input_boolean.turn_on"
        target:
          entity_id: "input_boolean.ventilation_active"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "환기 기록 시작 · 창문·에어컨·선풍기는 직접 확인"
  aircon_power_once:
    alias: "에어컨 전원 버튼 1회"
    description: "ON/OFF 모두 전원 토글. 실제 전원 피드백 없음."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "daikin_power_once"
      -
        delay: "00:00:02"
  aircon_mode_next:
    alias: "에어컨 모드 다음 단계"
    description: "ON=자동→제습→냉방→난방→송풍 순환. 현재 모드를 추정하지 않음."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "daikin_mode_next"
      -
        delay: "00:00:02"
  aircon_timer_next:
    alias: "에어컨 종료 예약 다음 단계"
    description: "OFF=1~9시간→없음 순환. 확정 종료나 예약 취소가 아님."
    mode: "single"
    max_exceeded: "silent"
    sequence:
      -
        action: "switchbot_ir_allowlist.send"
        data:
          action: "daikin_timer_next"
      -
        delay: "00:00:02"
  ventilation_cancel:
    alias: "환기 기록 취소"
    mode: "single"
    sequence:
      -
        action: "input_boolean.turn_off"
        target:
          entity_id: "input_boolean.ventilation_active"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "환기 기록 취소 · 가전 변경 없음"
intent_script:
  SmartHomePreset:
    action:
      -
        if:
          -
            condition: "state"
            entity_id: "input_boolean.smarthome_voice_enabled"
            state: "off"
        then:
          -
            stop: "음성 제어 검증 전입니다."
            error: true
      -
        choose:
          -
            conditions: "{{ action_name == 'scene_wake' }}"
            sequence:
              -
                action: "script.scene_wake"
          -
            conditions: "{{ action_name == 'scene_away' }}"
            sequence:
              -
                action: "script.scene_away"
          -
            conditions: "{{ action_name == 'scene_arrival' }}"
            sequence:
              -
                action: "script.scene_arrival"
          -
            conditions: "{{ action_name == 'scene_movie' }}"
            sequence:
              -
                action: "script.scene_movie"
          -
            conditions: "{{ action_name == 'scene_sleep' }}"
            sequence:
              -
                action: "script.scene_sleep"
          -
            conditions: "{{ action_name == 'scene_ventilation' }}"
            sequence:
              -
                action: "script.scene_ventilation"
          -
            conditions: "{{ action_name == 'ventilation_cancel' }}"
            sequence:
              -
                action: "script.ventilation_cancel"
        default:
          -
            stop: "현재 허용되지 않은 음성 명령입니다."
            error: true
    speech:
      text: "{{ states('input_text.smarthome_scene_status') }}. 적외선 기기의 실제 상태는 확인하지 않았습니다."
  SmartHomeUnsupported:
    speech:
      text: "현재 에어컨은 전원 토글·모드·예약 순환만 가능합니다. 확정 끄기·온도 지정·선풍기 강풍·전체 끄기는 실행하지 않았습니다. 수동 리모컨을 확인하세요."
automation:
  -
    id: "smarthome_wake_after_sunrise"
    alias: "스마트홈 - 일출 기반 기상"
    mode: "single"
    trigger:
      -
        platform: "sun"
        event: "sunrise"
        offset: "00:30:00"
        id: "sunrise_plus_30"
      -
        platform: "time"
        at: "06:30:00"
        id: "earliest_0630"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_automations_enabled"
        state: "on"
      -
        condition: "template"
        value_template: "{{ is_state(states('input_text.smarthome_resident_person'), 'home') }}"
      -
        condition: "or"
        conditions:
          -
            condition: "and"
            conditions:
              -
                condition: "trigger"
                id: "sunrise_plus_30"
              -
                condition: "time"
                after: "06:29:59"
          -
            condition: "and"
            conditions:
              -
                condition: "trigger"
                id: "earliest_0630"
              -
                condition: "state"
                entity_id: "sun.sun"
                state: "above_horizon"
              -
                condition: "template"
                value_template: "{{ (as_timestamp(now()) - as_timestamp(states.sun.sun.last_changed)) >= 1800 }}"
    action:
      -
        action: "script.scene_wake"
  -
    id: "smarthome_away_after_10_minutes"
    alias: "스마트홈 - 10분 외출 감지"
    mode: "single"
    trigger:
      -
        platform: "template"
        value_template: "{% set person_state = states(states('input_text.smarthome_resident_person')) %} {{ person_state not in ['home', 'unknown', 'unavailable', 'none', ''] }}"
        for: "00:10:00"
    action:
      -
        action: "script.scene_away"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_automations_enabled"
        state: "on"
  -
    id: "smarthome_arrival"
    alias: "스마트홈 - 귀가 감지"
    mode: "single"
    trigger:
      -
        platform: "template"
        value_template: "{{ is_state(states('input_text.smarthome_resident_person'), 'home') }}"
    action:
      -
        action: "script.scene_arrival"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_automations_enabled"
        state: "on"
  -
    id: "smarthome_co2_notice_1000"
    alias: "스마트홈 - CO2 1000ppm 환기 알림"
    mode: "single"
    trigger:
      -
        platform: "template"
        value_template: "{{ is_state('binary_sensor.smarthome_co2_fresh', 'on') and (1000 <= (states('sensor.smarthome_co2') | float(0)) < 1500) }}"
    action:
      -
        action: "{{ states('input_text.smarthome_notify_service') }}"
        data:
          title: "CO₂ 환기 안내"
          message: "CO₂ {{ states('sensor.smarthome_co2') }} ppm. HA 마지막 수신 {{ states('sensor.smarthome_co2_last_report') }}. 창문과 에어컨 상태를 직접 확인하세요."
          data:
            tag: "smarthome_co2"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_notifications_enabled"
        state: "on"
      -
        condition: "template"
        value_template: "{{ states('input_text.smarthome_notify_service').startswith('notify.mobile_app_') }}"
      -
        condition: "state"
        entity_id: "binary_sensor.smarthome_co2_fresh"
        state: "on"
      -
        condition: "template"
        value_template: "{{ this.attributes.last_triggered is none or (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered)) >= 1800 }}"
  -
    id: "smarthome_co2_urgent_1500"
    alias: "스마트홈 - CO2 1500ppm 긴급 알림"
    mode: "single"
    trigger:
      -
        platform: "template"
        value_template: "{{ is_state('binary_sensor.smarthome_co2_fresh', 'on') and ((states('sensor.smarthome_co2') | float(0)) >= 1500) }}"
    action:
      -
        action: "{{ states('input_text.smarthome_notify_service') }}"
        data:
          title: "CO₂ 높은 수치 안내"
          message: "CO₂ {{ states('sensor.smarthome_co2') }} ppm. HA 마지막 수신 {{ states('sensor.smarthome_co2_last_report') }}. 창문과 에어컨 상태를 직접 확인하세요."
          data:
            tag: "smarthome_co2"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_notifications_enabled"
        state: "on"
      -
        condition: "template"
        value_template: "{{ states('input_text.smarthome_notify_service').startswith('notify.mobile_app_') }}"
      -
        condition: "state"
        entity_id: "binary_sensor.smarthome_co2_fresh"
        state: "on"
      -
        condition: "template"
        value_template: "{{ this.attributes.last_triggered is none or (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered)) >= 1800 }}"
  -
    id: "smarthome_ventilation_complete"
    alias: "스마트홈 - 새 CO2 수신으로 환기 완료 확인"
    mode: "single"
    trigger:
      -
        platform: "time_pattern"
        minutes: "/1"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_notifications_enabled"
        state: "on"
      -
        condition: "template"
        value_template: "{{ states('input_text.smarthome_notify_service').startswith('notify.mobile_app_') }}"
      -
        condition: "state"
        entity_id: "binary_sensor.smarthome_ventilation_low"
        state: "on"
      -
        condition: "template"
        value_template: "{% set low = as_timestamp(states.binary_sensor.smarthome_ventilation_low.last_changed, 0) %} {% set s = states[states('input_text.smarthome_co2_entity')] %} {{ s is not none and as_timestamp(now()) - low >= 600 and as_timestamp(s.last_reported, 0) >= low + 600 }}"
    action:
      -
        action: "{{ states('input_text.smarthome_notify_service') }}"
        data:
          title: "환기 수치 확인"
          message: "새 CO₂ 수신에서 800ppm 미만이 다시 확인됐습니다. 연속 실측 보장은 아닙니다. 창문은 직접 확인하세요. 가전 변경 없음."
          data:
            tag: "smarthome_ventilation_complete"
      -
        action: "input_boolean.turn_off"
        target:
          entity_id: "input_boolean.ventilation_active"
      -
        action: "input_text.set_value"
        target:
          entity_id: "input_text.smarthome_scene_status"
        data:
          value: "환기 수치 확인 · 가전 변경 없음"
  -
    id: "smarthome_co2_stale"
    alias: "스마트홈 - CO2 수신 지연"
    mode: "single"
    trigger:
      -
        platform: "state"
        entity_id: "binary_sensor.smarthome_co2_fresh"
        from: "on"
        to: "off"
        for: "00:02:00"
    condition:
      -
        condition: "state"
        entity_id: "input_boolean.smarthome_notifications_enabled"
        state: "on"
      -
        condition: "template"
        value_template: "{{ states('input_text.smarthome_notify_service').startswith('notify.mobile_app_') }}"
    action:
      -
        action: "{{ states('input_text.smarthome_notify_service') }}"
        data:
          title: "CO₂ 수신 확인 필요"
          message: "CO₂ 값이 없거나 HA 수신이 15분 이상 지연됐습니다. 환기 완료를 판정하지 않습니다. SwitchBot 독립 경보를 확인하세요."
          data:
            tag: "smarthome_co2_stale"
template:
  -
    binary_sensor:
      -
        name: "smarthome_curtain_ready"
        unique_id: "smarthome_curtain_ready"
        state: "{% set e = states('input_text.smarthome_curtain_entity') %} {{ is_state('input_boolean.smarthome_curtain_verified','on') and e.startswith('cover.') and states(e) not in ['unknown','unavailable','none',''] }}"
      -
        name: "smarthome_co2_fresh"
        unique_id: "smarthome_co2_fresh"
        state: "{% set e = states('input_text.smarthome_co2_entity') %} {% set s = states[e] if e.startswith('sensor.') else none %} {% set age = as_timestamp(now()) - as_timestamp(s.last_reported, 0) if s is not none else 999999 %} {{ s is not none and is_number(s.state) and 0 < (s.state | float(0)) < 100000 and 0 <= age <= 900 }}"
      -
        name: "smarthome_ventilation_low"
        unique_id: "smarthome_ventilation_low"
        state: "{{ is_state('input_boolean.ventilation_active','on') and is_state('binary_sensor.smarthome_co2_fresh','on') and 0 < (states(states('input_text.smarthome_co2_entity')) | float(0)) < 800 }}"
      -
        name: "smarthome_daikin_power_once_ready"
        unique_id: "smarthome_daikin_power_once_ready"
        state: "{{ 'daikin_power_once' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
      -
        name: "smarthome_daikin_mode_next_ready"
        unique_id: "smarthome_daikin_mode_next_ready"
        state: "{{ 'daikin_mode_next' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
      -
        name: "smarthome_daikin_timer_next_ready"
        unique_id: "smarthome_daikin_timer_next_ready"
        state: "{{ 'daikin_timer_next' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
      -
        name: "smarthome_fan_power_ready"
        unique_id: "smarthome_fan_power_ready"
        state: "{{ 'fan_power' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
      -
        name: "smarthome_fan_speed_cycle_ready"
        unique_id: "smarthome_fan_speed_cycle_ready"
        state: "{{ 'fan_speed_cycle' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
      -
        name: "smarthome_fan_timer_cycle_ready"
        unique_id: "smarthome_fan_timer_cycle_ready"
        state: "{{ 'fan_timer_cycle' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
      -
        name: "smarthome_fan_mute_toggle_ready"
        unique_id: "smarthome_fan_mute_toggle_ready"
        state: "{{ 'fan_mute_toggle' in (state_attr('switchbot_ir_allowlist.status', 'verified_actions') or []) }}"
    sensor:
      -
        name: "smarthome_co2"
        unique_id: "smarthome_co2"
        device_class: "carbon_dioxide"
        unit_of_measurement: "ppm"
        availability: "{{ is_state('binary_sensor.smarthome_co2_fresh','on') }}"
        state: "{{ states(states('input_text.smarthome_co2_entity')) }}"
      -
        name: "smarthome_temperature"
        unique_id: "smarthome_temperature"
        device_class: "temperature"
        unit_of_measurement: "°C"
        availability: "{{ is_number(states(states('input_text.smarthome_temperature_entity'))) }}"
        state: "{{ states(states('input_text.smarthome_temperature_entity')) }}"
      -
        name: "smarthome_co2_last_report"
        unique_id: "smarthome_co2_last_report"
        device_class: "timestamp"
        availability: "{% set e = states('input_text.smarthome_co2_entity') %} {{ e.startswith('sensor.') and states[e] is not none }}"
        state: "{% set s = states[states('input_text.smarthome_co2_entity')] %} {{ s.last_reported.isoformat() if s is not none else none }}"
